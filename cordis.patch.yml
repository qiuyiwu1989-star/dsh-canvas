# 把思考画布接进 harness。
#
# 用 dsh plugin 安装后会自动进入 profile 的 bundle 列表;也可以手动挂:
#   dsh web --patch ./node_modules/dsh-canvas/cordis.patch.yml
#
# 这一行只是宿主半侧的空壳。画布本身是浏览器插件,走本包的
# package.json `exports["./client"]`。宿主行必须存在——客户端 bundle 是从
# Loader 条目里扫出来的,没有行就没有画布。
#
# 这里刻意不带 config:行配置不会跨到浏览器半侧(宿主 apply 拿得到,
# 浏览器 apply 拿不到),写了也只是看着像开关。画布的缩放、筛选和卡片
# 位置都留在浏览器本地,见 README「状态存在哪」。
- insert:
    - id: canvas
      name: 'dsh-canvas'
