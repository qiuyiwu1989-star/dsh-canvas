name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Contract and interaction tests
        # The interaction suite borrows React and jsdom from a DSH installation
        # and self-skips on a runner that has none.
        run: node --test test/*.test.mjs
      - name: End-to-end smoke
        run: node scripts/smoke.mjs
      - name: Publication gate
        run: node --test test/sanitize.test.mjs
